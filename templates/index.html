<!DOCTYPE html>
<html>
<head>
<div class="container mt-5">
    <title>Food Waste Reduction Platform</title>
</div>
</head>
<body>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">           
    
    <h1 class="text-center" mb-4>Food Waste Reduction Platform</h1>
</div>
    <div class="card p-4 shadow">
    <form action="/add" method="post" text>
        <center>
        <input type="text" name="donor" placeholder="Hotel / Donor Name" required><br><br>
        <input type="text" name="food_name" placeholder="Food Name" required><br><br>
        <input type="text" name="quantity" placeholder="Quantity" required><br><br>
        <input type="text" name="location" placeholder="Location" required><br><br>
        <button type="submit">Donate Food</button>
        </center>
    </form>
     </div>
    <hr>

    <h2>Available Donations</h2>

    {% for d in donations %}
    <div class="card mt-3">
    <div class="card-body">
        <p>
            <b>{{ d[1] }}</b> |
            {{ d[2] }} |
            {{ d[3] }} |
            {{ d[4] }} |
            {% if d[5]=='Available' %} 
                <button> <a href="/accept/{{ d[0] }}">Accept</a></button>
            {% endif %}
            <button><a href="/delete/{{ d[0] }}">Delete</a></button>
        </p>
    </div>
    </div>
    {% endfor %}
    </div>  
</body>
</html>
